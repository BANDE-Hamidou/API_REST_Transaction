# =============================================================================
# Groupe 5 - Thème 6 : PostgreSQL + API Express + Prometheus + Grafana
# KNIME n'est PAS dans Docker : application de bureau installée séparément
# (voir docs/KNIME_WORKFLOW.md).
#
#   Démarrer  : docker compose up -d --build
#   État      : docker compose ps
#   Journaux  : docker compose logs -f api
#   Arrêter   : docker compose down          (les données sont conservées)
#   Réinit.   : docker compose down -v       (SUPPRIME les données)
# =============================================================================
name: groupe5-transactions

services:
  postgres:
    image: postgres:16-alpine
    container_name: g5-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transactions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transactions}
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transactions} -d ${POSTGRES_DB:-transactions}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    image: g5-api-transactions:1.0.0
    container_name: g5-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-transactions}
      PGPASSWORD: ${POSTGRES_PASSWORD:-transactions}
      PGDATABASE: ${POSTGRES_DB:-transactions}
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      # sorties KNIME (data/processed) et résultats attendus (data/expected), en lecture seule
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: g5-prometheus
    restart: unless-stopped
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: g5-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-transactions.json
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  promdata:
  grafanadata:
